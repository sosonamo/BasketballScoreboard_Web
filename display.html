<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basketball Display</title>

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <style>
        body {
            margin: 0;
            background: #121212;
            color: white;
            font-family: Arial, sans-serif;
            user-select: none;
            overflow: hidden;
        }

        #app {
            width: 100vw;
            height: 100vh;
            display: grid;
            grid-template-columns: 1fr 1.1fr 1fr;
            gap: 2vw;
            padding: 3vw;
            box-sizing: border-box;
        }

        .team-panel, .center-panel {
            background: #202020;
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
        }

        .team-name {
            font-size: 4vw;
            font-weight: bold;
            margin-bottom: 2vw;
        }

        .score {
            font-size: 14vw;
            font-weight: bold;
            line-height: 1;
        }

        .home-score {
            color: #4fc3f7;
        }

        .away-score {
            color: #ff8a65;
        }

        .sub-info {
            margin-top: 2vw;
            font-size: 2vw;
            color: #aaa;
        }

        .title {
            color: #ff9800;
            font-size: 2vw;
            font-weight: bold;
            margin-bottom: 2vw;
        }

        .quarter {
            font-size: 3vw;
            font-weight: bold;
            margin-bottom: 2vw;
        }

        .game-time {
            font-size: 9vw;
            font-weight: bold;
            color: #00ff00;
            line-height: 1;
            margin-bottom: 3vw;
        }

        .shot-label {
            font-size: 1.5vw;
            color: #999;
            margin-bottom: 0.5vw;
        }

        .shot-clock {
            font-size: 9vw;
            font-weight: bold;
            line-height: 1;
        }

        .danger {
            color: #ff3333 !important;
            text-shadow: 0 0 20px rgba(255, 0, 0, 0.7);
        }

        .timeout-dots {
            display: flex;
            gap: 0.8vw;
            margin-top: 1vw;
        }

        .dot {
            width: 1.2vw;
            height: 1.2vw;
            border-radius: 50%;
            background: #444;
        }

        .dot.active {
            background: #ffeb3b;
            box-shadow: 0 0 12px #ffeb3b;
        }

        .status {
            position: fixed;
            bottom: 1vw;
            right: 1.5vw;
            color: #777;
            font-size: 1vw;
        }
    </style>
</head>

<body>
<div id="app">
    <!-- HOME -->
    <div class="team-panel">
        <div class="team-name">{{ teamA.name }}</div>
        <div class="score home-score">{{ teamA.score }}</div>

        <div class="sub-info">TEAM FOUL {{ teamA.foul }}</div>

        <div class="timeout-dots">
            <div v-for="n in 3" class="dot" :class="{ active: n <= teamA.timeout }"></div>
        </div>
    </div>

    <!-- CENTER -->
    <div class="center-panel">
        <div class="title">Basketball Scoreboard</div>

        <div class="quarter">{{ displayQuarter }}</div>

        <div class="game-time" :class="{ danger: gameTimeSec <= 60 }">
            {{ formattedGameTime }}
        </div>

        <div class="shot-label">SHOT CLOCK</div>
        <div class="shot-clock" :class="{ danger: shotClock <= 5 }">
            {{ shotClock }}
        </div>
    </div>

    <!-- AWAY -->
    <div class="team-panel">
        <div class="team-name">{{ teamB.name }}</div>
        <div class="score away-score">{{ teamB.score }}</div>

        <div class="sub-info">TEAM FOUL {{ teamB.foul }}</div>

        <div class="timeout-dots">
            <div v-for="n in 3" class="dot" :class="{ active: n <= teamB.timeout }"></div>
        </div>
    </div>

    <div class="status">
        {{ statusText }}
    </div>
</div>

<script type="module">
import { TimerLogic } from './boardLogic.js';
import {
    createLocalDisplayBridge,
    createPresentationReceiverBridge
} from './displayBridge.js';

const { createApp } = Vue;

createApp({
    data() {
        return {
            teamId: '',
            mode: 'local',
            source: '',
            isConnected: false,
            hasLiveData: false,
            isLocalSupported: true,
            localDisplayBridge: null,
            presentationReceiverBridge: null,
            localTickInterval: null,
            localStateRequestInterval: null,
            unsubscribeConnection: null,
            unsubscribeLiveGame: null,
            firebaseWaitInterval: null,

            quarter: 1,
            gameTimeSec: 600,
            shotClock: 24,
            isGameRunning: false,
            isShotClockRunning: false,
            gameDeadline: null,
            shotDeadline: null,

            teamA: {
                name: 'HOME',
                score: 0,
                foul: 0,
                timeout: 0
            },

            teamB: {
                name: 'AWAY',
                score: 0,
                foul: 0,
                timeout: 0
            }
        }
    },

    computed: {
        formattedGameTime() {
            return TimerLogic.formatTime(this.gameTimeSec);
        },

        displayQuarter() {
            if (this.quarter <= 4) {
                return this.quarter + 'Q';
            }
            return 'EX' + (this.quarter - 4);
        },

        statusText() {
            if (this.mode === 'local') {
                if (!this.isLocalSupported) return 'LOCAL DISPLAY UNSUPPORTED';
                if (!this.hasLiveData) return 'WAITING FOR LOCAL CONTROLLER...';
                return this.source ? `LOCAL · ${this.source.toUpperCase()}` : 'LOCAL';
            }

            if (!this.isConnected) return 'WAITING...';
            return this.hasLiveData ? 'LIVE' : 'NO DATA';
        }
    },

    methods: {
        applyLiveState(data) {
            if (!data) return;

            this.hasLiveData = true;
            this.isConnected = true;
            this.source = data.source ?? '';
            this.quarter = data.quarter ?? 1;
            this.gameTimeSec = Math.max(0, Number(data.gameTimeSec) || 0);
            this.shotClock = Math.max(0, Number(data.shotClock) || 0);
            this.isGameRunning = data.isGameRunning === true;
            this.isShotClockRunning = data.isShotClockRunning === true;
            this.gameDeadline = this.isGameRunning && Number(data.gameDeadline)
                ? Number(data.gameDeadline)
                : null;
            this.shotDeadline = this.isShotClockRunning && Number(data.shotDeadline)
                ? Number(data.shotDeadline)
                : null;

            this.teamA = {
                name: data.teamA?.name ?? 'HOME',
                score: data.teamA?.score ?? 0,
                foul: data.teamA?.foul ?? 0,
                timeout: data.teamA?.timeout ?? 0
            };

            this.teamB = {
                name: data.teamB?.name ?? 'AWAY',
                score: data.teamB?.score ?? 0,
                foul: data.teamB?.foul ?? 0,
                timeout: data.teamB?.timeout ?? 0
            };

            // 수신 시점에 이미 진행 중인 타이머를 즉시 현재 시각으로 보정합니다.
            this.tickLocalClocks();
        },

        tickLocalClocks() {
            if (this.isGameRunning && this.gameDeadline) {
                this.gameTimeSec = TimerLogic.remainingSeconds(this.gameDeadline);
                if (this.gameTimeSec === 0) {
                    this.isGameRunning = false;
                    this.gameDeadline = null;
                }
            }

            if (this.isShotClockRunning && this.shotDeadline) {
                this.shotClock = TimerLogic.remainingSeconds(this.shotDeadline);
                if (this.shotClock === 0) {
                    this.isShotClockRunning = false;
                    this.shotDeadline = null;
                }
            }
        },

        loadLocalGame() {
            this.presentationReceiverBridge = createPresentationReceiverBridge({
                onState: (state) => this.applyLiveState(state)
            });
            this.localDisplayBridge = createLocalDisplayBridge({
                role: 'display',
                getTeamId: () => this.teamId,
                onState: (state) => this.applyLiveState(state)
            });

            this.isLocalSupported = this.localDisplayBridge.isSupported
                || this.presentationReceiverBridge.isSupported;
            if (!this.isLocalSupported) return;

            // 표시 화면이 나중에 열려도 컨트롤러가 현재 상태를 다시 보내도록 요청합니다.
            if (this.localDisplayBridge.isSupported) this.localDisplayBridge.requestState();
            this.localStateRequestInterval = setInterval(() => {
                if (!this.hasLiveData && this.localDisplayBridge?.isSupported) {
                    this.localDisplayBridge.requestState();
                }
            }, 1000);

            // 메시지를 매초 받을 필요 없이 동일한 deadline으로 화면에서 직접 계산합니다.
            this.localTickInterval = setInterval(() => this.tickLocalClocks(), 100);
        },

        async loadFirebaseGame() {
            // 향후 원격 관전 모드를 다시 사용할 때만 Firebase 모듈을 불러옵니다.
            await import('./firebaseConfig.js');

            let attempts = 0;
            this.firebaseWaitInterval = setInterval(() => {
                attempts++;
                if (!window.db || !window.dbRef || !window.dbOnValue) {
                    if (attempts >= 100) {
                        clearInterval(this.firebaseWaitInterval);
                        this.firebaseWaitInterval = null;
                    }
                    return;
                }

                clearInterval(this.firebaseWaitInterval);
                this.firebaseWaitInterval = null;

                const connectionRef = window.dbRef(window.db, '.info/connected');
                this.unsubscribeConnection = window.dbOnValue(connectionRef, (snapshot) => {
                    this.isConnected = snapshot.val() === true;
                });

                const liveRef = window.dbRef(window.db, `teams/${this.teamId}/liveGame`);
                this.unsubscribeLiveGame = window.dbOnValue(liveRef, (snapshot) => {
                    const data = snapshot.val();
                    this.hasLiveData = !!data;
                    if (data) this.applyLiveState(data);
                });
            }, 300);
        },

        loadLiveGame() {
            const params = new URLSearchParams(window.location.search);
            this.teamId = params.get('teamId') ?? '';
            this.mode = params.get('mode') === 'online' ? 'online' : 'local';

            if (!this.teamId) {
                alert('teamId가 없습니다.');
                return;
            }

            if (this.mode === 'online') {
                this.loadFirebaseGame();
            } else {
                this.loadLocalGame();
            }
        }
    },

    mounted() {
        this.loadLiveGame();
    },

    beforeUnmount() {
        if (this.localTickInterval) clearInterval(this.localTickInterval);
        if (this.localStateRequestInterval) clearInterval(this.localStateRequestInterval);
        if (this.localDisplayBridge) this.localDisplayBridge.close();
        if (this.presentationReceiverBridge) this.presentationReceiverBridge.close();
        if (this.firebaseWaitInterval) clearInterval(this.firebaseWaitInterval);
        if (this.unsubscribeConnection) this.unsubscribeConnection();
        if (this.unsubscribeLiveGame) this.unsubscribeLiveGame();
    }
}).mount('#app');
</script>
</body>
</html>
