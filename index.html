<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basketball Scoreboard</title>
    <script type="module" src="firebaseConfig.js"></script>
    <style>
        body { display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100vh; margin: 0;
            background-color: #121212; color: white; font-family: 'Pretendard', sans-serif; }

        h1 { font-size: 3rem; margin-bottom: 50px; text-shadow: 0 0 10px rgba(255, 255, 255, 0.3); }

        .selection-container { display: flex; gap: 30px; }

        .card {
            width: 250px; background-color: #1e1e1e; border: 2px solid #333; border-radius: 20px;
            padding: 40px; margin-bottom: 30px; cursor: pointer;
            text-align: center; transition: all 0.3s ease; text-decoration: none; color: inherit;
        }

        .card:hover { border-color: #ff6b00; box-shadow: 0 10px 30px rgba(255, 107, 0, 0.2);
            transform: translateY(-10px); }

        .card h2 { font-size: 2rem; color: #ff6b00; margin-bottom: 15px; }

        .card p { color: #aaa; line-height: 1.5; }

        .badge { display: inline-block; background: linear-gradient(45deg, #ff6b00, #ffbb00); color: black;
            border-radius: 5px; margin-bottom: 10px; padding: 5px 10px;
            font-size: 0.8rem; font-weight: bold; }

        .login-container { display: flex; margin-top: 50px; gap: 15px; 
            justify-content: center; align-items: stretch; }
        .login-btn { width: 80px; background: #333; color: #fff; border: 1px solid #444;
            padding: 10px; border-radius: 6px; cursor: pointer; transition: 0.2s; }
        .login-btn.plus:hover { background: #555; }
        
    </style>
</head>

<body>
    <div id="app">
        <h1>BASKETBALL SCOREBOARD</h1>

        <div class="selection-container">
            <div class="card" @click="checkAccess('basic')">
                <div class="badge">Free</div>
                <h2>BASIC</h2>
                <p>팀별 데이터의 기본 모드</p>
            </div>

            <div class="card" @click="checkAccess('pro')">
                <div class="badge">Subscribe</div>
                <h2>PRO</h2>
                <p>선수별 데이터의 디테일 모드</p>
            </div>
        </div>

        <div class="login-container">
            <template v-if="!isLoggedIn">
                <div style="display: flex; flex-direction: column; gap: 8px;">
                    <input
                        type="email"
                        v-model="email"
                        style="width: 150px; padding: 8px;"
                        placeholder="이메일"
                    >
                    <input type="password" v-model="password" style="width: 150px; padding: 8px;" placeholder="비밀번호">
                </div>
                <div style="display: flex;">
                    <button class="login-btn" @click="handleLogin">Login</button>
                </div>
            </template>

            <div v-else style="text-align: center; width: 100%; animation: fadeIn 0.5s;">
                <h3 style="margin: 0; color: #f39c12;">안녕하세요, {{ currentUser?.email }}님!!</h3>
                <p style="margin: 5px 0 0; font-size: 0.9em; color: #ccc;">원하시는 모드를 선택해 주세요.</p>
                <button class="login-btn plus" @click="handleLogout" style="margin-top: 10px;">Logout</button>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

    <script>
        const { createApp } = Vue;

        createApp({
            data() {
                return {
                    isLoggedIn: false,
                    email: '',
                    password: '',
                    currentUser: null,
                    authReady: false
                }
            },
            methods: {
                // [Login] 버튼을 눌렀을 때
                async handleLogin() {
                    if (!this.authReady) {
                        alert("로그인 서비스를 불러오는 중입니다. 잠시 후 다시 시도해주세요.");
                        return;
                    }

                    if (!this.email || !this.password) {
                        alert("이메일과 비밀번호를 입력해주세요.");
                        return;
                    }

                    try {
                        await window.setAuthPersistence(
                            window.auth,
                            window.browserLocalPersistence
                        );

                        const result = await window.signInWithEmailAndPassword(
                            window.auth,
                            this.email,
                            this.password
                        );

                        this.currentUser = result.user;
                        this.isLoggedIn = true;
                        this.password = "";

                        console.log("로그인 성공:", result.user.uid);
                    } catch (error) {
                        console.error("로그인 오류:", error);

                        if (error.code === "auth/invalid-credential") {
                            alert("이메일 또는 비밀번호가 올바르지 않습니다.");
                        } else if (error.code === "auth/too-many-requests") {
                            alert("로그인 시도가 너무 많습니다. 잠시 후 다시 시도해주세요.");
                        } else {
                            alert("로그인에 실패했습니다.");
                        }
                    }
                },

                // 카드를 눌렀을 때 (로그인 체크 문지기)
                checkAccess(mode) {
                    if (!this.authReady) {
                        alert("로그인 상태를 확인하는 중입니다. 잠시만 기다려주세요.");
                        return;
                    }

                    if (!this.isLoggedIn) {
                        alert("로그인을 먼저 해주세요!");
                        return;
                    }

                    // 로그인 된 상태라면 이동
                    const targetPage =
                        mode === 'pro'
                            ? 'pro.html'
                            : 'basic.html';

                    location.href = targetPage;
                },
                async handleLogout() {
                    try {
                        await window.firebaseSignOut(window.auth);

                        this.currentUser = null;
                        this.isLoggedIn = false;
                        this.email = "";
                        this.password = "";
                    } catch (error) {
                        console.error("로그아웃 오류:", error);
                        alert("로그아웃에 실패했습니다.");
                    }
                }
            },
            mounted() {
                let attempts = 0;
                const waitFirebase = setInterval(() => {
                    attempts++;
                    if (!window.auth || !window.onAuthStateChanged) {
                        if (attempts >= 100) {
                            clearInterval(waitFirebase);
                            alert("로그인 서비스를 불러오지 못했습니다. 네트워크 연결을 확인해주세요.");
                        }
                        return;
                    }

                    clearInterval(waitFirebase);

                    window.onAuthStateChanged(
                        window.auth,
                        (user) => {
                            this.authReady = true;
                            this.currentUser = user;
                            this.isLoggedIn = !!user;

                            if (!user) {
                                this.email = "";
                                this.password = "";
                                return;
                            }

                            console.log("현재 로그인 사용자:", user.email);
                            console.log("현재 사용자 UID:", user.uid);
                        }
                    );
                }, 100);
            }
        }).mount('#app');
    </script>

    <style>
        /* 부드러운 전환을 위한 애니메이션 */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</body>
</html>
