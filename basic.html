<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>농구 점수판 Basic</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

    <style>
        /* 기본 설정 */
        body { background-color: #121212; margin: 0; padding: 5px; user-select: none;
            font-family: 'Arial', sans-serif;  color: white; }
        .container { max-width: 1000px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; padding-bottom: 50px;}
        .context-label { font-size: 0.7rem; color: #888; font-weight: bold; margin-bottom: 5px; }
        .danger-text {color: #ff3333; text-shadow: 0 0 10px rgba(255, 51, 51, 0.5); }

        /* Button Standard */
        /*button { cursor: pointer; border: none; border-radius: 4px; font-weight: bold; color: white;
            touch-action: manipulation; transition: 0.2s; }
        .btn-sm { padding: 5px 10px; font-size: 0.8rem; }
        .btn-md { padding: 10px; font-size: 1rem; }
        button:active { transform: scale(0.92); }*/
        .btn-group { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-top: 10px; }
        .standard-btn { width: 50px; background: #333; color: #fff; border: 1px solid #444;
            padding: 8px 12px; border-radius: 6px; cursor: pointer; transition: 0.2s; }
        .standard-btn.plus:hover { background: #555; }
        
        /* 3분할 레이아웃 */
        .main-board {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #333;
            gap: 15px;
        }

        .side-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #252525;
            padding: 20px;
            border-radius: 12px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }

        .center-panel {
            flex: 1.3;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
        }

        /* ---  Side Panel --- */

        /* Team Name */
        .team-name-input { width: 100%; background: transparent; border: none; border-bottom: 2px solid #444;
            color: white; font-size: 1.5rem; font-weight: bold; text-align: center; margin-bottom: 0px; }
        
        /* Timeout */
        .timeout-section { display: flex; flex-direction: column; align-items: center;
            gap: 5px; margin-top: 30px; margin-bottom: 20px; }
        .timeout-dots { display: flex; gap: 8px; }
        .timeout-dot { width: 16px; height: 16px; background-color: #444; border-radius: 50%;
            cursor: pointer; transition: 0.2s; box-shadow: inset 0 0 5px rgba(0,0,0,0.5);}
        .timeout-dot.active { background-color: #ffeb3b;
            box-shadow: 0 0 10px #ffeb3b, inset 0 0 3px rgba(255,255,255,0.8); }

        /* Team Foul */
        .foul-section { text-align: center; margin-top: 35px; margin-bottom: 20px; }
        .foul-number { margin-top: 10px; margin-bottom: 0px;
            font-size: 4.0rem; font-weight: bold; min-width: 40px; transition: color 0.3s; }

        /* Team Score */
        .totalScore-section { text-align: center; align-items: center; margin-top: 40px; margin-bottom: 20px; }
        .totalScore-number { display: flex; justify-content: center; gap: 8px; margin-top: 20px; margin-bottom: 20px;
            font-size: 5rem; font-weight: bold; line-height: 1; }

        
        /* --- Center Panel --- */
        /* Title */
        .title-label { width: 100%; background: transparent; border: none; border-bottom: 0px solid #444;
            margin-top: 20px; margin-bottom: 10px;
            color: #ff9800; font-size: 1.5rem; font-weight: bold; text-align: center; }
        
        /* Quarter */
        .quarter-section { text-align: center; margin-top: 4px; margin-bottom: 19px; }
        .quarter-number { font-size: 1.5rem; font-weight: bold; color: white; }

        /* Game Clock */
        .gameClock-section { text-align: center; margin-top: 10px; margin-bottom: 20px; }
        .gameClock-number { margin-top: 15px; margin-bottom: 15px; cursor: pointer;
            font-size: 4.0rem; color: #00ff00; font-weight: bold; line-height: 1; }

        /* Shot Clock */
        .shotClock-section { text-align: center; margin-top: 20px; margin-bottom: 20px; }
        .shotClock-number { margin-top: 15px; margin-bottom: 10px; cursor: pointer; line-height: 1;
            font-size: 6.0rem; font-weight: bold; }
        .shotClock-danger { color: #ff0000 !important; }


        /* --- Under Control Bar (fixed) --- */
        .option-section { display: flex; position: fixed; bottom: 0; left: 0; width: 100%; background: #111; padding: 10px;
            justify-content: center; gap: 10px; border-top: 1px solid #333; }
        .option-btn { width: 100px; background: #333; border: none; border-radius: 4px; padding: 8px 12px;
            cursor: pointer; touch-action: manipulation; transition: 0.2s;
            font-size: 0.8rem; font-weight: bold; color: white;}

        /* --- Game Setup --- */
        .setup-overlay {
            position: fixed; inset: 0; z-index: 1000;
            display: flex; align-items: center; justify-content: center;
            box-sizing: border-box; padding: 20px;
            background: rgba(10, 10, 10, 0.98);
        }
        .setup-modal {
            width: min(520px, 100%); padding: 26px; box-sizing: border-box;
            border: 1px solid #444; border-radius: 14px; background: #1e1e1e;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.55);
        }
        .setup-modal h2 { margin: 0 0 8px; color: #ff9800; text-align: center; }
        .setup-description { margin: 0 0 22px; color: #aaa; text-align: center; font-size: 0.9rem; }
        .setup-team-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
        .setup-field { display: flex; flex-direction: column; gap: 7px; }
        .setup-field label { color: #bbb; font-size: 0.78rem; font-weight: bold; }
        .setup-input {
            width: 100%; box-sizing: border-box; padding: 12px;
            border: 1px solid #555; border-radius: 7px; background: #2b2b2b;
            color: white; font-size: 1rem;
        }
        .setup-start-btn {
            width: 100%; margin-top: 22px; padding: 13px;
            border: none; border-radius: 7px; background: #e67e22;
            color: white; cursor: pointer; font-size: 1rem; font-weight: bold;
        }
        .setup-start-btn:hover { background: #f39c12; }
        @media (max-width: 560px) {
            .setup-team-grid { grid-template-columns: 1fr; }
        }

    </style>
</head>
<body>


<div id="app" class="container">
    <div v-if="!setupComplete" class="setup-overlay">
        <form class="setup-modal" @submit.prevent="completeGameSetup">
            <h2>Basic 경기 설정</h2>
            <p class="setup-description">양 팀 이름을 입력한 후 점수판을 시작하세요.</p>
            <div class="setup-team-grid">
                <div class="setup-field">
                    <label for="basic-home-name">HOME 팀명</label>
                    <input id="basic-home-name" v-model.trim="teamA.name" class="setup-input" required autocomplete="off">
                </div>
                <div class="setup-field">
                    <label for="basic-away-name">AWAY 팀명</label>
                    <input id="basic-away-name" v-model.trim="teamB.name" class="setup-input" required autocomplete="off">
                </div>
            </div>
            <button class="setup-start-btn" type="submit">점수판 시작</button>
        </form>
    </div>
    
    <div v-show="setupComplete" class="main-board">

        <!-- Side Panel (Home) -->
        <div class="side-panel">
            
            <input v-model="teamA.name" class="team-name-input" @change="syncDisplay">

            <div class="timeout-section">
                <span class="context-label">TIMEOUT</span>
                <div class="timeout-dots">
                    <div v-for="n in 3" 
                         :key="n" 
                         class="timeout-dot"
                         :class="{ 'active': n <= teamA.timeout }"
                         @click="toggleTimeout('A', n)">
                    </div>
                </div>
            </div>

            <div class="foul-section">
                <div class="context-label">TEAM FOUL</div>
                <div class="foul-number" :class="{ 'danger-text': teamAFoul >= 4 }">{{ teamAFoul }}</div>
                <div class="btn-group">
                    <button class="standard-btn" @click="updateFoul('A', -1)">-1</button>
                    <button class="standard-btn" @click="updateFoul('A', 1)">+1</button>
                </div>
            </div>

            <div class="totalScore-section">
                <div class="context-label">TEAM SCORE</div>
                <div class="totalScore-number" style="color:#4fc3f7">{{ teamAScore }}</div>
                <div class="btn-group">
                    <button class="standard-btn" @click="updateScore('A', -1)">-1</button>
                    <button class="standard-btn plus" @click="updateScore('A', 1)">+1</button>
                    <button class="standard-btn plus" @click="updateScore('A', 2)">+2</button>
                    <button class="standard-btn plus" @click="updateScore('A', 3)">+3</button>
                </div>
            </div>
            
        </div>
            
        <!-- Center Panel -->
        <div class="center-panel">

            <div class="title-label">Basketball Scoreboard</div>

            <div class="quarter-section">
                <div class="context-label">QUARTER</div>
                <div class="quarter-number">{{ displayQuarter }}</div>
            </div>
            
            <div class="gameClock-section">
                <div class="context-label">GAME CLOCK</div>
                <div class="gameClock-number" @click="toggleGameClock">{{ formattedGameTime }}</div>
                <div class="btn-group">
                    <button class="standard-btn" @click="mdifityGameClock(-60)">-1m</button>
                    <button class="standard-btn" style="width: 80px;" @click="changeQuarter(-1)">Pre Q</button>
                    <button class="standard-btn" style="width: 80px;" @click="nextQuarter">Next Q</button>
                    <button class="standard-btn" @click="mdifityGameClock(60)">+1m</button>
                </div>
            </div>
            
            <div class="shotClock-section">
                <div class="context-label">SHOT CLOCK</div>
                <div class="shotClock-number" :class="{ 'danger-text': shotClock <= 5 }"
                    @click="toggleShotClock">{{ shotClock }}</div>
                <div class="btn-group">
                    <button class="standard-btn" @click="modifyShotClock(-1)">-1s</button>
                    <button class="standard-btn" style="background:#258325; width: 80px;"
                        @click="resetShotClock(24)">24</button>
                    <button class="standard-btn" style="background:#258325; width: 80px;"
                        @click="resetShotClock(14)">14</button>
                    <button class="standard-btn" @click="modifyShotClock(1)">+1s</button>
                </div>
            </div>
        </div>
    
        <!-- Side Panel (Away) -->
        <div class="side-panel">
            <input v-model="teamB.name" class="team-name-input" @change="syncDisplay">
            
            <div class="timeout-section">
                <span class="context-label">TIMEOUT</span>
                <div class="timeout-dots">
                    <div v-for="n in 3" 
                         :key="n" 
                         class="timeout-dot"
                         :class="{ 'active': n <= teamB.timeout }"
                         @click="toggleTimeout('B', n)">
                    </div>
                </div>
            </div>

            <div class="foul-section">
                <div class="context-label">TEAM FOUL</div>
                <div class="foul-number" :class="{ 'danger-text': teamBFoul >= 4 }">{{ teamBFoul }}</div>
                <div class="btn-group">
                    <button class="standard-btn" @click="updateFoul('B', -1)">-1</button>
                    <button class="standard-btn" @click="updateFoul('B', 1)">+1</button>
                </div>
            </div>

            <div class="totalScore-section">
                <div class="context-label">TEAM SCORE</div>
                <div class="totalScore-number" style="color:#ff8a65">{{ teamBScore }}</div>
                <div class="btn-group">
                    <button class="standard-btn" @click="updateScore('B', -1)">-1</button>
                    <button class="standard-btn plus" @click="updateScore('B', 1)">+1</button>
                    <button class="standard-btn plus" @click="updateScore('B', 2)">+2</button>
                    <button class="standard-btn plus" @click="updateScore('B', 3)">+3</button>
                </div>
            </div>
        </div>

    </div>

    <!-- Option Bar (under) -->
    <div v-show="setupComplete" style="height:50px;"></div>
    <div v-show="setupComplete" class="option-section">
        <button class="option-btn" style="background:#2e7d32;" @click="openDisplay">📺 외부 모니터</button>
        <button class="option-btn" style="background:#d32f2f;" @click="resetGame">🔄 Reset</button>
        <button class="option-btn" style="background:#ba9852;" @click="playBuzzer">🚨 Buzzer</button>
        <button class="option-btn" style="background:#1d2967;" @click="saveFullGame">💾 Save</button>
        <button class="option-btn" style="background:#1d2967;" @click="exportToJson">📤 Export</button>
        <button class="option-btn" style="background:#7b1f1f;" @click="handleLogout">🚪 Logout</button>
    </div>

</div>

<script type="module">
    import { initialTimerData, TimerLogic } from './boardLogic.js';
    import {
        createLocalDisplayBridge,
        createPresentationControllerBridge
    } from './displayBridge.js';
    import './firebaseConfig.js';

    const { createApp } = Vue;
    createApp({
        data() {
            return {
                ...JSON.parse(JSON.stringify(initialTimerData)),
                // 팀 데이터 초기화 (HTML의 v-model과 연결)
                teamId: '',
                teamName: '',
                teamPassword: '',
                setupComplete: false,
                teamA: { name: 'HOME', timeout: 0 },
                teamB: { name: 'AWAY', timeout: 0 },
                teamAScore: 0,
                teamBScore: 0,
                teamAFoul: 0,
                teamBFoul: 0,
                gameHistory: [],
                authUnsubscribe: null,
                firebaseWaitInterval: null,
                localDisplayBridge: null,
                localDisplayHeartbeat: null,
                presentationDisplayBridge: null
            }
        },
        computed: {
            // 게임 시간을 00:00 포맷으로 변환 (UI 표시용)
            formattedGameTime() {
                return TimerLogic.formatTime(this.gameTimeSec);
            },
            // Quarter
            displayQuarter() {
                if (this.quarter <= 4) {
                    return this.quarter + "Q";
                } else {
                    return "Ex" + (this.quarter - 4); // 5Q -> Ex1, 6Q -> Ex2
                }
            },
            // 1분 미만일 때 빨간색으로 변하게 하는 로직
            isGameTimeDanger() {
                return this.gameTimeSec < 60;
            },
        },
        methods: {
            completeGameSetup() {
                this.teamA.name = this.teamA.name.trim() || 'HOME';
                this.teamB.name = this.teamB.name.trim() || 'AWAY';
                this.setupComplete = true;
                this.$nextTick(() => this.syncDisplay());
            },
        
            // --- 메인 게임 클락 제어 ---
            toggleGameClock() {
                if (this.isGameRunning) this.stopGameClock();
                else this.startGameClock();
            },
            startGameClock() {
                if (this.gameInterval || this.gameTimeSec <= 0) return;
                this.isGameRunning = true;
                this.gameDeadline = TimerLogic.createDeadline(this.gameTimeSec);
                this.gameInterval = setInterval(() => {
                    const nextTime = TimerLogic.remainingSeconds(this.gameDeadline);

                    if (nextTime !== this.gameTimeSec) {
                        this.gameTimeSec = nextTime;
                    }

                    if (nextTime === 0) {
                        this.stopGameClock();
                        this.playBuzzer();
                    }
                }, 200);
                this.syncDisplay();
            },
            stopGameClock(shouldPublish = true) {
                clearInterval(this.gameInterval);
                this.gameInterval = null;
                this.gameDeadline = null;
                this.isGameRunning = false;
                if (shouldPublish) this.syncDisplay();
            },

            // --- 샷클락 제어 ---
            toggleShotClock() {
                if (this.isShotClockRunning) this.stopShotClock();
                else this.startShotClock();
            },
            startShotClock() {
                if (this.shotInterval || this.shotClock <= 0) return;
                this.isShotClockRunning = true;
                this.shotDeadline = TimerLogic.createDeadline(this.shotClock);
                this.shotInterval = setInterval(() => {
                    const previousTime = this.shotClock;
                    const nextTime = TimerLogic.remainingSeconds(this.shotDeadline);

                    if (nextTime !== previousTime) {
                        this.shotClock = nextTime;

                        if (nextTime <= 5 && nextTime > 0) {
                            this.speakNumber(nextTime); // 5, 4, 3, 2, 1 음성 출력
                        }
                        if (nextTime === 0) {
                            this.playBuzzer();    // 0이 되면 삐~ 소리
                            this.stopShotClock(); // 시계 정지
                        }
                    }
                }, 200);
                this.syncDisplay();
            },
            stopShotClock(shouldPublish = true) {
                clearInterval(this.shotInterval);
                this.shotInterval = null;
                this.shotDeadline = null;
                this.isShotClockRunning = false;
                if (shouldPublish) this.syncDisplay();
            },

            // --- Modify Clock
            mdifityGameClock(sec) { // +/- 1분 기능
                const maxTime = 720; // 12분(12 * 60초)
                const newTime = this.gameTimeSec + sec;

                if (newTime >= 0 && newTime <= maxTime) {
                    this.gameTimeSec = newTime;
                } else if (newTime > maxTime) {
                    this.gameTimeSec = maxTime; // 12분을 초과하면 12분으로 고정
                }
                if (this.isGameRunning) {
                    this.gameDeadline = TimerLogic.createDeadline(this.gameTimeSec);
                }
                this.syncDisplay();
            },
            modifyShotClock(sec) { // +/- 1초 기능
                const newTime = this.shotClock + sec;
    
                if (newTime >= 0 && newTime <= 24) {
                    this.shotClock = newTime;
                } else if (newTime > 24) {
                    this.shotClock = 24; // 24초를 초과하려고 하면 24로 고정
                }
                if (this.isShotClockRunning) {
                    this.shotDeadline = TimerLogic.createDeadline(this.shotClock);
                }
                this.syncDisplay();
            },
            resetShotClock(sec) {
                TimerLogic.resetShotClock(this, sec);
                if (this.isShotClockRunning) {
                    this.shotDeadline = TimerLogic.createDeadline(this.shotClock);
                }
                this.syncDisplay();
            },
            changeQuarter(val) {
                if (val > 0) TimerLogic.nextQuarter(this);
                else this.quarter = Math.max(1, this.quarter - 1);
                this.syncDisplay();
            },
            nextQuarter() {
                this.saveQuarterToHistory();
                this.quarter++;
                this.teamAFoul = 0;
                this.teamBFoul = 0;
                this.gameTimeSec = 600; 
                this.shotClock = 24;
                this.stopGameClock();
                this.stopShotClock();
                // alert(`${this.displayQuarter} 시작!`);
                this.syncDisplay();
            },

            // --- Sound --- //
            // Count down (TTS)
            speakNumber(num) {
                const message = new SpeechSynthesisUtterance(num.toString());
                message.lang = 'ko-KR'; // 한국어 설정
                message.rate = 1.5;     // 읽는 속도
                window.speechSynthesis.speak(message);
            },

            // --- Viewer Diplay --- //
            async openDisplay() {

                if (!this.teamId) {
                    alert("로그인 후 사용하세요.");
                    return;
                }

                const displayUrl = new URL('display.html', location.href);
                displayUrl.searchParams.set('mode', 'local');
                displayUrl.searchParams.set('teamId', this.teamId);

                if (this.presentationDisplayBridge?.isSupported) {
                    try {
                        await this.presentationDisplayBridge.start(displayUrl.href);
                        this.syncDisplay();
                        return;
                    } catch (error) {
                        console.warn('외부 모니터 연결 실패:', error);
                        if (error?.name === 'NotAllowedError') return;
                    }
                }

                const isMobile = navigator.userAgentData?.mobile === true
                    || /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
                if (isMobile) {
                    alert(
                        '현재 휴대폰/브라우저는 외부 화면 분리 출력을 지원하지 않습니다.\n\n' +
                        'HDMI 미러링에서는 휴대폰과 모니터에 서로 다른 화면을 표시할 수 없습니다. ' +
                        '외부 화면(프레젠테이션) 기능을 지원하는 브라우저나 DeX 확장 모드를 사용하거나, ' +
                        '모니터 쪽에 별도 기기를 연결해야 합니다.'
                    );
                    return;
                }

                if (!this.localDisplayBridge?.isSupported) {
                    alert('이 브라우저는 로컬 Display 연결을 지원하지 않습니다.');
                    return;
                }

                window.open(displayUrl.href, 'display', 'width=1400,height=900');
                setTimeout(() => this.syncDisplay(), 100);
            },

            getLocalDisplayState() {
                return {
                    source: 'basic',
                    quarter: this.quarter,
                    gameTimeSec: this.gameTimeSec,
                    shotClock: this.shotClock,
                    isGameRunning: this.isGameRunning,
                    isShotClockRunning: this.isShotClockRunning,
                    gameDeadline: this.isGameRunning ? this.gameDeadline : null,
                    shotDeadline: this.isShotClockRunning ? this.shotDeadline : null,
            
                    teamA: {
                        name: this.teamA.name,
                        score: this.teamAScore,
                        foul: this.teamAFoul,
                        timeout: this.teamA.timeout
                    },
            
                    teamB: {
                        name: this.teamB.name,
                        score: this.teamBScore,
                        foul: this.teamBFoul,
                        timeout: this.teamB.timeout
                    }
                };
            },

            initializeLocalDisplay() {
                if (this.localDisplayBridge) this.localDisplayBridge.close();

                this.localDisplayBridge = createLocalDisplayBridge({
                    role: 'controller',
                    getTeamId: () => this.teamId,
                    getState: () => this.getLocalDisplayState()
                });
                this.presentationDisplayBridge = createPresentationControllerBridge({
                    getState: () => this.getLocalDisplayState()
                });

                clearInterval(this.localDisplayHeartbeat);
                this.localDisplayHeartbeat = setInterval(() => this.syncDisplay(), 5000);
            },

            syncDisplay() {
                const localPublished = this.localDisplayBridge?.publish() || false;
                const presentationPublished = this.presentationDisplayBridge?.publish() || false;
                return localPublished || presentationPublished;
            },
            
            // --- 점수 및 파울 (양옆 패널) ---
            toggleTimeout(team, index) {
                const target = team === 'A' ? this.teamA : this.teamB;
                
                // 현재 켜져 있는 불을 누르면 꺼짐 (타임아웃 사용)
                if (index === target.timeout) {
                    target.timeout--;
                    // this.stopTimer(); // 작전타임 시 타이머 정지 (선택 사항)
                    this.stopGameClock();
                    this.stopShotClock();
                } 
                // 바로 다음 꺼져 있는 불을 누르면 켜짐 (타임아웃 취소)
                else if (index === target.timeout + 1) {
                    target.timeout++;
                }
                // 그 외의 경우는 작동하지 않음 (순서대로 켜고 꺼야 함)
                this.syncDisplay();
            },
            updateScore(team, val) {
                if (team === 'A') this.teamAScore = Math.max(0, this.teamAScore + val);
                else this.teamBScore = Math.max(0, this.teamBScore + val);
                this.syncDisplay();
            },
            updateFoul(team, val) {
                if (team === 'A') {
                    // 0과 5 사이로 제한
                    const newFoul = this.teamAFoul + val;
                    if (newFoul >= 0 && newFoul <= 5) {
                        this.teamAFoul = newFoul;
                    }
                } else {
                    const newFoul = this.teamBFoul + val;
                    if (newFoul >= 0 && newFoul <= 5) {
                        this.teamBFoul = newFoul;
                    }
                }
                this.syncDisplay();
            },

            // --- 시스템 기능 ---
            resetGame() {
                if (!confirm("초기화할까요?")) return;

                this.stopGameClock();
                this.stopShotClock();
                this.gameTimeSec = 600;
                this.shotClock = 24;
                this.quarter = 1;
                this.teamAScore = 0;
                this.teamBScore = 0;
                this.teamAFoul = 0;
                this.teamBFoul = 0;
                this.teamA.timeout = 0;
                this.teamB.timeout = 0;
                this.gameHistory = [];
                this.syncDisplay();
            },

            // Buzzer
            playBuzzer() {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();

                oscillator.type = 'square'; // 전광판 특유의 거친 소리
                oscillator.frequency.setValueAtTime(440, audioCtx.currentTime); // 주파수(음높이)
                
                gainNode.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 1.5);

                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);

                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 1.5); // 2초 동안 재생
            },
            
            // teamId를 기반으로 Firebase에서 팀 프로필 로드
            async loadTeamProfile(uid) {
                if (!window.db || !window.dbRef || !window.dbOnValue || !window.dbSet) {
                    throw new Error("Firebase Database가 준비되지 않았습니다.");
                }

                const userProfileRef = window.dbRef(
                    window.db,
                    `users/${uid}`
                );

                return new Promise((resolve, reject) => {
                    let unsubscribe = null;

                    unsubscribe = window.dbOnValue(
                        userProfileRef,
                        async (snapshot) => {
                            if (unsubscribe) {
                                unsubscribe();
                            }

                            try {
                                const profile = snapshot.val() || {};

                                let teamName = String(profile.teamName || "").trim();

                                // 아직 팀명이 등록되지 않은 계정은 최초 1회 입력
                                if (!teamName) {
                                    teamName = prompt(
                                        "Firebase에 사용할 팀명을 입력해주세요.",
                                        ""
                                    )?.trim();

                                    if (!teamName) {
                                        alert("팀명이 등록되지 않았습니다.");
                                        resolve(false);
                                        return;
                                    }

                                    await window.dbSet(userProfileRef, {
                                        ...profile,
                                        email: window.auth.currentUser?.email || "",
                                        teamName: teamName,
                                        updatedAt: Date.now()
                                    });
                                }

                                /*
                                * Firebase 경로에 사용할 수 없는 문자
                                * . # $ [ ] /
                                * 위 문자가 들어오면 _로 변경
                                */
                                const safeTeamName = teamName.replace(/[.#$[\]/]/g, "_");

                                this.teamName = teamName;
                                this.teamId = safeTeamName;

                                console.log("등록 팀명:", this.teamName);
                                console.log("Firebase 저장 경로:", this.teamId);

                                resolve(true);
                            } catch (error) {
                                reject(error);
                            }
                        },
                        (error) => {
                            if (unsubscribe) {
                                unsubscribe();
                            }

                            reject(error);
                        }
                    );
                });
            },

            // 쿼터 기록을 배열에 담는 내부 함수
            saveQuarterToHistory() {
                const record = {
                    quarterName: this.displayQuarter, // Ex1, 4Q 등
                    scoreA: this.teamAScore,
                    scoreB: this.teamBScore,
                    foulA: this.teamAFoul,
                    foulB: this.teamBFoul
                };
                const existingIndex = this.gameHistory.findIndex(
                    (item) => item.quarterName === record.quarterName
                );

                if (existingIndex >= 0) {
                    this.gameHistory.splice(existingIndex, 1, record);
                } else {
                    this.gameHistory.push(record);
                }

                return record;
            },

            getHistoryWithCurrentQuarter() {
                const history = this.gameHistory.map((item) => ({ ...item }));
                const currentRecord = {
                    quarterName: this.displayQuarter,
                    scoreA: this.teamAScore,
                    scoreB: this.teamBScore,
                    foulA: this.teamAFoul,
                    foulB: this.teamBFoul
                };
                const existingIndex = history.findIndex(
                    (item) => item.quarterName === currentRecord.quarterName
                );

                if (existingIndex >= 0) history[existingIndex] = currentRecord;
                else history.push(currentRecord);

                return history;
            },
            
            async saveFullGame() {
                const user = window.auth?.currentUser;

                if (!user) {
                    alert("로그인이 필요합니다.");
                    location.href = "index.html";
                    return;
                }

                if (!this.teamId) {
                    alert("등록된 팀명을 찾을 수 없습니다.");
                    return;
                }
            
                const history = this.getHistoryWithCurrentQuarter();
            
                // 서버에 저장할 데이터 뭉치 만들기
                const newGame = {
                    id: Date.now(),
                    date: new Date().toLocaleString(),

                    teamName: this.teamName,
                    createdBy: user.uid,
                    createdByEmail: user.email || "",

                    homeTeam: this.teamA.name,
                    awayTeam: this.teamB.name,

                    history,

                    finalScore: {
                        A: this.teamAScore,
                        B: this.teamBScore
                    }
                };
            
                try {
                    // Firebase 서버에 저장 (경로: teams/팀명/games/게임ID)
                    const gameRef = window.dbRef(
                        window.db,
                        `teams/${this.teamId}/games/${newGame.id}`
                    );

                    await window.dbSet(gameRef, newGame);
                    this.gameHistory = history;
                    alert(`서버 저장 완료! 팀명: ${this.teamName}`);
                } catch (error) {
                    console.error("Firebase 저장 에러:", error);
                    alert("서버 저장에 실패했습니다. 인터넷 연결을 확인하세요.");
                }
            },
            async handleLogout() {
                const confirmed = confirm("로그아웃하시겠습니까?");
                if (!confirmed) return;

                try {
                    this.stopGameClock();
                    this.stopShotClock();

                    await window.firebaseSignOut(window.auth);
                    location.href = "index.html";
                } catch (error) {
                    console.error("로그아웃 오류:", error);
                    alert("로그아웃에 실패했습니다.");
                }
            },

            exportToJson() {
                const history = this.getHistoryWithCurrentQuarter();
                const dataStr = JSON.stringify(history, null, 2);
                const dataBlob = new Blob([dataStr], { type: 'application/json' });
                
                // 가상의 다운로드 링크 생성
                const url = URL.createObjectURL(dataBlob);
                const link = document.createElement('a');
                link.href = url;
                link.download = `basketball_record_${new Date().getTime()}.json`;
                
                // 클릭 및 삭제
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                URL.revokeObjectURL(url);
            },
        },
        mounted() {
            let attempts = 0;
            this.firebaseWaitInterval = setInterval(() => {
                attempts++;
                if (!window.auth || !window.onAuthStateChanged) {
                    if (attempts >= 100) {
                        clearInterval(this.firebaseWaitInterval);
                        this.firebaseWaitInterval = null;
                        alert("Firebase를 불러오지 못했습니다. 네트워크 연결을 확인해주세요.");
                    }
                    return;
                }

                clearInterval(this.firebaseWaitInterval);
                this.firebaseWaitInterval = null;

                this.authUnsubscribe = window.onAuthStateChanged(window.auth, async (user) => {
                    if (!user) {
                        alert("로그인이 필요합니다.");
                        location.href = "index.html";
                        return;
                    }

                    console.log("Basic 로그인 사용자:", user.email);

                    try {
                        const loaded = await this.loadTeamProfile(user.uid);
                        if (loaded) {
                            this.initializeLocalDisplay();
                            this.syncDisplay();
                        }
                    } catch (error) {
                        console.error("팀 프로필 로드 오류:", error);
                        alert("팀 정보를 불러오지 못했습니다.");
                    }
                });
            }, 100);
        },
        beforeUnmount() {
            this.stopGameClock(false);
            this.stopShotClock(false);
            if (this.firebaseWaitInterval) clearInterval(this.firebaseWaitInterval);
            if (this.authUnsubscribe) this.authUnsubscribe();
            if (this.localDisplayHeartbeat) clearInterval(this.localDisplayHeartbeat);
            if (this.localDisplayBridge) this.localDisplayBridge.close();
            if (this.presentationDisplayBridge) this.presentationDisplayBridge.close();
        }
    }).mount('#app');
</script>
